          <p style={S.p}>La <strong>opción escolarizada de 3 años</strong> está pensada para quienes acaban de terminar la secundaria y quieren la experiencia completa de preparatoria, con clases presenciales, seguimiento cercano y preparación para la universidad.</p>
          <p style={S.p}>La <strong>opción auto-planeada de 2 años</strong> es para quienes ya trabajan, tienen responsabilidades familiares o dejaron los estudios y quieren retomarlos sin renunciar a su rutina. Al ser modalidad mixta, combinas avance independiente con sesiones presenciales.</p>
        </div>

        {/* Requisitos */}
        <div style={S.panel}>
          <h2 style={S.h2}>Requisitos de admisión</h2>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:24 }} className="req-grid">
            {[
              { titulo:'Bachillerato General (3 años)', docs:['Acta de nacimiento (copia certificada)','CURP','Certificado de secundaria original','3 fotografías tamaño infantil a color'] },
              { titulo:'Bachillerato en 2 años', docs:['Acta de nacimiento (copia certificada)','CURP','Certificado de secundaria original','3 fotografías tamaño infantil a color','Tener 16 años cumplidos al momento de la admisión'] },
            ].map((r, i) => (
              <div key={i} style={S.reqCard}>
                <div style={S.reqTitle}>{r.titulo}</div>
                {r.docs.map((d, j) => (
                  <div key={j} style={S.reqItem}><div style={S.reqDot} /><span>{d}</span></div>
                ))}
              </div>
            ))}
          </div>
        </div>

        {/* Ubicación / NAP */}
        <div style={S.panel}>
          <h2 style={S.h2}>Dónde estamos en Mexicali</h2>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:24 }} className="req-grid">

              <div style={S.napV}>Calle Roberto Montenegro #26, Fracc. Rancho la Bodega, C.P. 21379, Mexicali, Baja California</div>
              <div style={S.napL}>Teléfono</div>
              <div style={S.napV}>(686) 844-7575</div>
              <div style={S.napL}>WhatsApp</div>
              <div style={{ ...S.napV, marginBottom:0 }}>(664) 490-1395</div>
            </div>
            <div style={S.napBox}>
              <div style={S.napL}>Reconocimientos oficiales</div>
              <div style={S.napV}>RVOE-MS-BC-007-M1/26 — Bachillerato General, opción escolarizada</div>
              <div style={S.napV}>RVOE-MS-BC-008-M1/26 — Bachillerato General, opción auto-planeada (mixta)</div>
              <div style={{ ...S.napL, marginBottom:0 }}>Otorgados por la Secretaría de Educación de Baja California, Dirección de Educación Media Superior.</div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <section style={{ background:'#0F1E4A', padding:'56px 0' }}>
      <div style={{ maxWidth:900, margin:'0 auto', padding:'0 24px', textAlign:'center' }}>
        <h2 style={{ fontFamily:"'Varsity Impact',serif", fontSize:'clamp(26px,4vw,40px)', fontWeight:800, color:'#fff', textTransform:'uppercase', marginBottom:12 }}>Inscripciones abiertas en Mexicali</h2>
        <p style={{ fontFamily:"'Figtree',sans-serif", fontSize:16, color:'rgba(255,255,255,0.7)', marginBottom:32, lineHeight:1.6 }}>Escríbenos y te decimos el próximo período disponible, costos y becas.</p>
