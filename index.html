<script type="text/babel">
// ── Hash routing (no external library needed) ───────────

const PAGE_ROUTES = {
  'home':               '/',
  'nosotros':           '/universidad-cies-tijuana',
  'licenciaturas':      '/licenciaturas-tijuana-baja-california',
  'lic-derecho':        '/licenciatura-en-derecho-tijuana',
  'lic-comercio':       '/licenciatura-comercio-exterior-aduanas-tijuana',
  'lic-administracion': '/licenciatura-administracion-empresas-tijuana',
  'lic-educacion':      '/licenciatura-ciencias-educacion-tijuana',
  'ingenierias':        '/ingenierias-tijuana-baja-california',
  'ing-robotica':       '/ingenieria-robotica-ia-tijuana',
  'ing-ia':             '/ingenieria-inteligencia-artificial-tijuana',
  'ing-mecatronica':    '/ingenieria-mecatronica-tijuana',
  'ing-industrial':     '/ingenieria-industrial-tijuana',
  'maestrias':          '/maestrias-ejecutivas-tijuana',
  'mba':                '/mba-ejecutivo-tijuana',
  'mie':                '/maestria-innovacion-educativa-tijuana',
  'preparatoria':       '/preparatoria-tijuana-certificado-sep',
  'admisiones':         '/admisiones-universidad-tijuana',
};
const ROUTE_PAGES = Object.fromEntries(Object.entries(PAGE_ROUTES).map(([k,v]) => [v, k]));

const getPageFromHash = () => {
  const hash = window.location.hash.replace(/^#/, '') || '/';
  return ROUTE_PAGES[hash] || 'home';
};

const pushHash = (pageKey) => {
  const path = PAGE_ROUTES[pageKey] || '/';
  window.location.hash = path;
};

// ── SEO meta per page ───────────────────────────────────
const PAGE_META = {
  'home':               { title:'Universidad CIES Tijuana — Licenciaturas, Ingenierías y Maestrías', desc:'Universidad CIES Tijuana: +30 años formando profesionistas en Baja California. Licenciaturas, ingenierías, maestrías ejecutivas y preparatoria con RVOE SEP. Blvd. Federico Benítez 5.' },
  'nosotros':           { title:'Universidad CIES Tijuana — Quiénes somos | Historia y Valores', desc:'Conoce la misión, visión y valores de Universidad CIES, una de las instituciones de educación superior más reconocidas de Tijuana, Baja California, México.' },
  'licenciaturas':      { title:'Licenciaturas en Tijuana con RVOE SEP — Universidad CIES', desc:'4 licenciaturas en Tijuana: Derecho, Comercio Exterior y Aduanas, Administración de Empresas y Ciencias de la Educación. Modalidad presencial en Baja California.' },
  'lic-derecho':        { title:'Licenciatura en Derecho Tijuana — Universidad CIES | RVOE SEP', desc:'Estudia Derecho en Tijuana. Litigación oral, derecho penal, civil, aduanero y migratorio para el contexto fronterizo México-Estados Unidos. RVOE SEP.' },
  'lic-comercio':       { title:'Licenciatura Comercio Exterior y Aduanas Tijuana — CIES | RVOE BC-L008', desc:'Licenciatura en Comercio Exterior y Aduanas en Tijuana BC. T-MEC, clasificación arancelaria, Ley Aduanera. RVOE BC-L008-M2/23.' },
  'lic-administracion': { title:'Licenciatura Administración de Empresas Tijuana — CIES | RVOE BC-L015', desc:'Licenciatura en Administración de Empresas en Tijuana, Baja California. Liderazgo, finanzas, mercadotecnia y emprendimiento. RVOE BC-L015-M2/23.' },
  'lic-educacion':      { title:'Licenciatura Ciencias de la Educación Tijuana — CIES | RVOE BC-L025', desc:'Estudia Ciencias de la Educación en Tijuana. Pedagogía, tecnología educativa, diseño curricular y gestión escolar. RVOE BC-L025-M2/23.' },
  'ingenierias':        { title:'Ingenierías en Tijuana para la Industria 4.0 — Universidad CIES', desc:'4 ingenierías en Tijuana: Robótica, Inteligencia Artificial, Mecatrónica e Industrial. Formación presencial para el corredor maquilador de Baja California.' },
  'ing-robotica':       { title:'Ingeniería en Robótica e IA Tijuana — Universidad CIES Baja California', desc:'Ingeniería en IA y Robótica en Tijuana BC. Sistemas robóticos, visión artificial, PLCs, microcontroladores e IoT para la industria maquiladora de Baja California.' },
  'ing-ia':             { title:'Ingeniería Inteligencia Artificial Tijuana — Universidad CIES', desc:'Estudia Ingeniería en Inteligencia Artificial en Tijuana. Machine learning, redes neuronales, automatización e IoT para la industria tecnológica y manufacturera de BC.' },
  'ing-mecatronica':    { title:'Ingeniería en Mecatrónica Tijuana — Universidad CIES Baja California', desc:'Ingeniería en Mecatrónica en Tijuana, BC. Mecánica, electrónica, control y computación para la industria aeroespacial, médica y manufacturera del corredor fronterizo.' },
  'ing-industrial':     { title:'Ingeniería Industrial Tijuana Baja California — Universidad CIES', desc:'Ingeniería Industrial en Tijuana, BC. Optimización de procesos, control estadístico, gestión de producción y automatización para el parque industrial más grande de México.' },
  'maestrias':          { title:'Maestrías Ejecutivas Tijuana — MBA e Innovación Educativa | CIES', desc:'Maestrías ejecutivas en Tijuana, Baja California: MBA y Maestría en Innovación Educativa. 4 semestres, 75 créditos. Viernes y sábados. Validez SEP.' },
  'mba':                { title:'MBA Ejecutivo Tijuana Baja California — Universidad CIES', desc:'MBA Ejecutivo en Tijuana, BC. 4 semestres, 75 créditos. Finanzas, liderazgo, estrategia y negocios internacionales. Viernes y sábados para profesionistas de Baja California.' },
  'mie':                { title:'Maestría en Innovación Educativa Tijuana — Universidad CIES', desc:'Maestría en Innovación Educativa en Tijuana, Baja California. 4 semestres, 75 créditos. Didáctica, diseño curricular y tecnología educativa. Modalidad ejecutiva.' },
  'preparatoria':       { title:'Preparatoria Tijuana Certificado SEP — Universidad CIES', desc:'Preparatoria en Tijuana, BC con certificado válido ante la SEP. Bachillerato General (3 años) y Modalidad a Dos Años. Becas disponibles. Blvd. Federico Benítez 5.' },
  'admisiones':         { title:'Admisiones Universidad CIES Tijuana — Inscríbete por WhatsApp', desc:'Proceso de admisión en Universidad CIES, Tijuana Baja California. Inscríbete por WhatsApp (664) 490-1395. Licenciaturas, ingenierías, maestrías, preparatoria y becas.' },
};
const applyMeta = (pageKey) => {
  const m = PAGE_META[pageKey] || PAGE_META['home'];
  document.title = m.title;
  const upsertMeta = (name, content, prop = false) => {
    const attr = prop ? 'property' : 'name';
    let el = document.querySelector(`meta[${attr}="${name}"]`);
    if (!el) { el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
    el.content = content;
  };
  upsertMeta('description', m.desc);
  upsertMeta('og:title', m.title, true);
  upsertMeta('og:description', m.desc, true);
  upsertMeta('og:type', 'website', true);
  upsertMeta('og:locale', 'es_MX', true);
  // Canonical URL based on hash path
  const path = PAGE_ROUTES[pageKey] || '/';
  let canonical = document.querySelector('link[rel="canonical"]');
  if (!canonical) { canonical = document.createElement('link'); canonical.rel = 'canonical'; document.head.appendChild(canonical); }
  canonical.href = 'https://universidadcies.mx' + path;
};

// ── Tweaks defaults ─────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primaryColor": "#2B4DA8",
  "accentColor": "#C23535",
  "darkBg": "#0F1E4A",
  "whatsappVisible": true
}/*EDITMODE-END*/;

// ── Main App ────────────────────────────────────────────
const App = () => {
  const [page, setPage]         = React.useState(getPageFromHash);
  const [tweaks, setTweaks]     = React.useState(TWEAK_DEFAULTS);
  const [tweakOpen, setTweakOpen] = React.useState(false);
  const [animKey, setAnimKey]   = React.useState(0);

  // Listen to hash changes (back/forward + direct URL)
  React.useEffect(() => {
    const onHash = () => {
      const p = getPageFromHash();
      setPage(p);
      setAnimKey(k => k + 1);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // Apply SEO meta whenever page changes
  React.useEffect(() => { applyMeta(page); }, [page]);

  // Edit mode messages
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode')   setTweakOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweakOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // CSS vars
  React.useEffect(() => {
    document.documentElement.style.setProperty('--color-blue', tweaks.primaryColor);
    document.documentElement.style.setProperty('--color-red',  tweaks.accentColor);
    document.documentElement.style.setProperty('--color-navy', tweaks.darkBg);
  }, [tweaks]);

  const updateTweak = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };

  // navigate(pageKey) → go to dedicated page file
  const navigate = (pageKey) => {
    const href = window.CIES_NAV && window.CIES_NAV[pageKey];
    if (href) { window.location.href = href; return; }
    // fallback: hash
    pushHash(pageKey);
    setPage(pageKey);
    setAnimKey(k => k + 1);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const programPages = ['lic-derecho','lic-comercio','lic-administracion','lic-educacion','ing-robotica','ing-ia','ing-mecatronica','ing-industrial'];

  const renderPage = () => {
    if (programPages.includes(page)) {
      const data = PROGRAMAS[page];
      return data ? <ProgramPage key={page} program={data} onNavigate={navigate} /> : <HomePage onNavigate={navigate} />;
    }
    switch (page) {
      case 'nosotros':      return <NosotrosPage      onNavigate={navigate} />;
      case 'licenciaturas': return <LicenciaturasPage onNavigate={navigate} />;
      case 'ingenierias':   return <IngenieriasPage   onNavigate={navigate} />;
      case 'maestrias':     return <MaestriasPage     onNavigate={navigate} />;
      case 'mba':           return <MBAPage           onNavigate={navigate} />;
      case 'mie':           return <MIEPage           onNavigate={navigate} />;
      case 'preparatoria':  return <PreparatoriaPage  onNavigate={navigate} />;
      case 'admisiones':    return <AdmisionesPage    onNavigate={navigate} />;
      default:              return <HomePage          onNavigate={navigate} />;
    }
  };

  return (
    <div>
      <Nav currentPage={page} onNavigate={navigate} />
      <main key={animKey} className="page-enter">{renderPage()}</main>
      <SiteFooter onNavigate={navigate} />
      {tweaks.whatsappVisible && <WhatsAppFAB />}
      <BecaBanner />

      {tweakOpen && (
        <div style={tweakS.panel}>
          <div style={tweakS.title}>Tweaks</div>
          {[
            ['Color primario', 'primaryColor'],
            ['Color acento',   'accentColor'],
            ['Fondo oscuro',   'darkBg'],
          ].map(([label, key]) => (
            <div key={key} style={tweakS.field}>
              <label style={tweakS.label}>{label}</label>
              <div style={tweakS.row}>
                <input type="color" value={tweaks[key]} onChange={e => updateTweak(key, e.target.value)} style={tweakS.picker} />
                <span style={tweakS.hex}>{tweaks[key]}</span>
              </div>
            </div>
          ))}
          <div style={tweakS.field}>
            <label style={tweakS.label}>Botón WhatsApp</label>
            <label style={tweakS.toggle}>
              <input type="checkbox" checked={tweaks.whatsappVisible} onChange={e => updateTweak('whatsappVisible', e.target.checked)} />
              <span style={{ marginLeft:6, fontSize:13, color:'#5A5A5A' }}>{tweaks.whatsappVisible ? 'Visible' : 'Oculto'}</span>
            </label>
          </div>
          <div style={tweakS.divider} />
          <div style={tweakS.sectionLabel}>Ir a página</div>
          <div style={tweakS.pagesGrid}>
            {[['home','Inicio'],['nosotros','Nosotros'],['licenciaturas','Licenciaturas'],
              ['ingenierias','Ingenierías'],['maestrias','Maestrías'],['preparatoria','Prepa'],
              ['admisiones','Admisiones'],['lic-derecho','Derecho'],['ing-robotica','Robótica'],
              ['ing-ia','IA'],['mba','MBA'],['mie','MIE']
            ].map(([p,label]) => (
              <button key={p} style={{...tweakS.pageBtn,...(page===p?tweakS.pageBtnActive:{})}} onClick={()=>navigate(p)}>{label}</button>
            ))}
          </div>
          <div style={tweakS.divider} />
          <div style={{...tweakS.sectionLabel, marginBottom:6}}>URL actual</div>
          <div style={{fontFamily:'monospace', fontSize:10, color:'#8A8A8A', wordBreak:'break-all'}}>{window.location.hash || '#/'}</div>
        </div>
      )}
    </div>
  );
};

const tweakS = {
  panel:        { position:'fixed', bottom:20, right:20, background:'#fff', borderRadius:10, boxShadow:'0 8px 32px rgba(0,0,0,0.18)', padding:'20px', width:240, zIndex:9999, fontFamily:"'Figtree',sans-serif", maxHeight:'85vh', overflowY:'auto' },
  title:        { fontSize:12, fontWeight:700, color:'#1A1A1A', marginBottom:16, textTransform:'uppercase', letterSpacing:'0.07em' },
  field:        { marginBottom:14 },
  label:        { fontSize:11, fontWeight:600, color:'#5A5A5A', marginBottom:6, display:'block' },
  row:          { display:'flex', alignItems:'center', gap:8 },
  picker:       { width:32, height:28, border:'none', background:'none', cursor:'pointer', padding:0, borderRadius:4 },
  hex:          { fontSize:11, fontFamily:'monospace', color:'#3D3D3D' },
  toggle:       { display:'flex', alignItems:'center', cursor:'pointer' },
  divider:      { height:1, background:'#F0F0F0', margin:'14px 0 10px' },
  sectionLabel: { fontSize:11, fontWeight:700, color:'#8A8A8A', textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:8 },
  pagesGrid:    { display:'grid', gridTemplateColumns:'1fr 1fr', gap:4 },
  pageBtn:      { background:'none', border:'1px solid #E8E8E8', padding:'5px 6px', fontSize:11, color:'#5A5A5A', cursor:'pointer', borderRadius:3, textAlign:'center' },
  pageBtnActive:{ background:'#E8EDF8', color:'#2B4DA8', fontWeight:600, borderColor:'#2B4DA8' },
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
